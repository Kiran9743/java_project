name: Build and push to DTR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}   # e.g. kiranhulk/java_project

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch emulation)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DTR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DTR_REGISTRY }}
          username: ${{ secrets.DTR_USERNAME }}
          password: ${{ secrets.DTR_PASSWORD }}

      - name: Build and push image to DTR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DTR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DTR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
          # Optional (uncomment if your DTR supports registry cache)
          # cache-from: type=registry,ref=${{ secrets.DTR_REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          # cache-to: type=registry,ref=${{ secrets.DTR_REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
