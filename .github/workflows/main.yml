name: Build and push Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker login (native)
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          docker build -t kiranhulk/java_project:latest .

      - name: Tag image
        run: |
          docker tag kiranhulk/java_project:latest kiranhulk/java_project:${{ github.sha }}

      - name: Push image
        run: |
          docker push kiranhulk/java_project:latest
          docker push kiranhulk/java_project:${{ github.sha }}
