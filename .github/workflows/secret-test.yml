name: Secret test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Check secrets
        run: |
          echo "DOCKER_USERNAME length = ${#DOCKER_USERNAME}"
          echo "DOCKER_PASSWORD length = ${#DOCKER_PASSWORD}"
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
